<!DOCTYPE html>
<html>
<head>
<title>Profile</title>
<style>
body{
    font-family:Arial;
    background:#020617;
    color:white;
    text-align:center;
    padding:40px;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:10px;
    display:inline-block;
}
button{
    margin-top:10px;
    padding:10px;
    background:red;
    border:none;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="card">
    <h2>Profile</h2>
    <p id="name"></p>
    <p id="email"></p>
    <button onclick="logout()">Logout</button>
</div>

<script>

async function loadProfile(){
    let token = localStorage.getItem("access");

    let res = await fetch("/profile",{
        headers:{
            "Authorization": "Bearer " + token
        }
    });

    if(res.status === 401){
        await refreshToken();
        return loadProfile();
    }

    let data = await res.json();

    document.getElementById("name").innerText = data.name;
    document.getElementById("email").innerText = data.email;
}

async function refreshToken(){
    let refresh = localStorage.getItem("refresh");

    let res = await fetch("/refresh",{
        method:"POST",
        headers:{
            "Authorization": "Bearer " + refresh
        }
    });

    let data = await res.json();

    localStorage.setItem("access", data.access_token);
}

function logout(){
    localStorage.clear();
    window.location.href = "index.html";
}

loadProfile();

</script>

</body>
</html>
