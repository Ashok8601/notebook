
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

<div class="bg-white p-8 rounded-lg shadow-lg w-96 text-center">
    <h2 class="text-2xl font-bold mb-4">User Profile</h2>

    <div id="profileData" class="space-y-2 text-left">
        <p><strong>Name:</strong> <span id="name"></span></p>
        <p><strong>Email:</strong> <span id="email"></span></p>
        <p><strong>DOB:</strong> <span id="dob"></span></p>
    </div>

    <button onclick="logout()"
        class="mt-6 w-full bg-red-500 text-white p-2 rounded hover:bg-red-600">
        Logout
    </button>
</div>

<script>
const token = localStorage.getItem('token');

// 🔒 Agar token nahi hai → login page par bhej do
if (!token) {
    alert("Please login first!");
    window.location.href = "login.html";
}

// 🔥 Fetch profile data
async function loadProfile() {
    try {
        const response = await fetch('http://127.0.0.1:5000/profile', {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token   // ✅ IMPORTANT
            }
        });

        const data = await response.json();
        console.log("Profile Data:", data);

        if (response.ok) {
            document.getElementById('name').innerText = data.name;
            document.getElementById('email').innerText = data.email;
            document.getElementById('dob').innerText = data.dob;
        } else {
            alert(data.message || "Error loading profile");
            window.location.href = "login.html";
        }

    } catch (error) {
        console.error("Error:", error);
        alert("Server error!");
    }
}

// 🚀 Load on page open
loadProfile();

// 🔓 Logout function
function logout() {
    localStorage.removeItem('token');
    alert("Logged out!");
    window.location.href = "login.html";
}
</script>

</body>
</html>
