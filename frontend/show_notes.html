<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Notes</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            padding: 20px;
        }

        h2 {
            text-align: center;
        }

        .note {
            background: white;
            padding: 15px;
            margin: 10px auto;
            width: 400px;
            border-radius: 10px;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: 0.2s;
        }

        .note:hover {
            transform: scale(1.02);
        }

        .title {
            font-weight: bold;
            font-size: 18px;
        }

        .content {
            margin-top: 5px;
            color: #555;
        }

        .logout {
            display: block;
            margin: 10px auto;
            padding: 8px 15px;
            background: red;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .top-bar {
            text-align: center;
            margin-bottom: 10px;
        }

        .add-btn {
            padding: 8px 15px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<h2>My Notes</h2>

<div class="top-bar">
    <button class="add-btn" onclick="goToCreate()">+ Create Note</button>
    <button class="logout" onclick="logout()">Logout</button>
</div>

<div id="notesContainer"></div>

<script>
    window.onload = () => {
        const token = localStorage.getItem("token");

        if (!token) {
            window.location.href = "login.html";
            return;
        }

        loadNotes();
    };

    async function loadNotes() {
        const token = localStorage.getItem("token");

        try {
            const response = await fetch("http://127.0.0.1:5000/notes", {
                method: "GET",
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            if (response.status === 401 || response.status === 422) {
                localStorage.removeItem("token");
                window.location.href = "login.html";
                return;
            }

            const data = await response.json();

            const container = document.getElementById("notesContainer");
            container.innerHTML = "";

            if (data.notes.length === 0) {
                container.innerHTML = "<p style='text-align:center;'>No notes found</p>";
                return;
            }

            data.notes.forEach(note => {
                const div = document.createElement("div");
                div.className = "note";

                div.innerHTML = `
                    <div class="title">${note.title}</div>
                    <div class="content">${note.content}</div>
                `;

                // 🔥 CLICK → EDIT PAGE
                div.onclick = () => {
                    window.location.href = "update_notes.html?id=" + note.id;
                };

                container.appendChild(div);
            });

        } catch (error) {
            console.error(error);
        }
    }

    function logout() {
        localStorage.removeItem("token");
        window.location.href = "login.html";
    }

    function goToCreate() {
        window.location.href = "create_note.html";
    }
</script>

</body>
</html>
